name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android licenses (SDK is preinstalled)
        continue-on-error: true
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      # Optional: keeps the same signing key every build, so the new APK
      # installs OVER the old app and your data stays.
      # Create secret DEBUG_KEYSTORE_BASE64 once (see README-APK.txt).
      - name: Use fixed signing key
        env:
          K: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$K" ]; then
            mkdir -p ~/.android
            echo "$K" | base64 -d > ~/.android/debug.keystore
          fi

      # Works if files are in the repo root, in a sub-folder,
      # or if you uploaded the .zip file itself (it gets extracted here).
      - name: Web files
        run: |
          while IFS= read -r -d '' z; do
            echo "Extracting: $z"
            unzip -o -q "$z" -d _unzipped || echo "Could not extract $z (skipped)"
          done < <(find . -maxdepth 2 -iname '*.zip' -not -path './node_modules/*' -print0)
          IDX=$(find . -name index.html -not -path './node_modules/*' -not -path './www/*' -not -path './android/*' | head -n 1)
          if [ -z "$IDX" ]; then echo "index.html not found anywhere in the repo"; ls -R | head -50; exit 1; fi
          SRC=$(dirname "$IDX")
          echo "Using web files from: $SRC"
          mkdir -p www
          cp "$SRC/index.html" "$SRC/sw.js" "$SRC/manifest.webmanifest" www/
          cp "$SRC"/icon-*.png www/
          ls -la www

      - name: Create Android project
        run: |
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor-community/speech-recognition@6
          npx cap init "Expense Tracker" com.expense.tracker --web-dir www
          npx cap add android
          npx cap sync android

      - name: Permissions (mic + backup files)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />#' $M
          grep -n "uses-permission" $M

      # Proper adaptive icon: green background + white taka symbol
      - name: App icon
        continue-on-error: true
        run: |
          RES=android/app/src/main/res
          FG=www/icon-adaptive.png
          [ -f "$FG" ] || FG=www/icon-foreground.png
          rm -rf $RES/mipmap-anydpi-v26
          rm -f $RES/mipmap-*/ic_launcher_background.png
          for d in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
            IFS=: read n s f <<< "$d"
            mkdir -p $RES/mipmap-$n
            for x in ic_launcher ic_launcher_round; do
              convert www/icon-512.png -resize ${s}x${s} $RES/mipmap-$n/$x.png 2>/dev/null || cp www/icon-192.png $RES/mipmap-$n/$x.png
            done
            convert $FG -resize ${f}x${f} $RES/mipmap-$n/ic_launcher_foreground.png 2>/dev/null || cp $FG $RES/mipmap-$n/ic_launcher_foreground.png
          done
          mkdir -p $RES/mipmap-anydpi-v26 $RES/values
          cat > $RES/values/ic_launcher_background.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#0e8a63</color>
          </resources>
          XML
          for x in ic_launcher ic_launcher_round; do
            cat > $RES/mipmap-anydpi-v26/$x.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          XML
          done
          ls -R $RES | head -40

      # Skip the system splash: same dark colour as the in-app loading screen,
      # invisible icon, so the app opens straight into the loading screen.
      - name: Seamless splash
        run: |
          RES=android/app/src/main/res
          mkdir -p $RES/values $RES/drawable
          cat > $RES/values/colors_splash.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="splash_bg">#0b1410</color>
          </resources>
          XML
          cat > $RES/drawable/splash_empty.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp"
              android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#00000000" android:pathData="M0,0h1v1z"/>
          </vector>
          XML
          cat > /tmp/styles_fix.py <<'PY'
          import re
          p = "android/app/src/main/res/values/styles.xml"
          s = open(p).read()
          new = (
              '<style name="AppTheme.NoActionBarLaunch" parent="Theme.SplashScreen">\n'
              '        <item name="android:background">@color/splash_bg</item>\n'
              '        <item name="windowSplashScreenBackground">@color/splash_bg</item>\n'
              '        <item name="windowSplashScreenAnimatedIcon">@drawable/splash_empty</item>\n'
              '        <item name="windowSplashScreenAnimationDuration">0</item>\n'
              '        <item name="postSplashScreenTheme">@style/AppTheme.NoActionBar</item>\n'
              '    </style>'
          )
          s2 = re.sub(r'<style name="AppTheme.NoActionBarLaunch".*?</style>', new, s, flags=re.S)
          assert s2 != s, "launch style not found"
          open(p, "w").write(s2)
          PY
          python3 /tmp/styles_fix.py
          cat $RES/values/styles.xml
          CJ=android/app/src/main/assets/capacitor.config.json
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('$CJ'));c.backgroundColor='#0b1410';fs.writeFileSync('$CJ',JSON.stringify(c,null,2))"

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: expense-tracker-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
